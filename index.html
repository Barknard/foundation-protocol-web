<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1614">
<meta name="color-scheme" content="dark">
<title>Foundation Protocol</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect width='96' height='96' fill='%231A1614'/><path d='M48 20 L78 72 L18 72 Z' fill='none' stroke='%23E8E2D2' stroke-width='6' stroke-linejoin='round'/><path d='M33 67 L48 45 L63 67 Z' fill='%23E8E2D2'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect width='96' height='96' fill='%231A1614'/><path d='M48 20 L78 72 L18 72 Z' fill='none' stroke='%23E8E2D2' stroke-width='6' stroke-linejoin='round'/><path d='M33 67 L48 45 L63 67 Z' fill='%23E8E2D2'/></svg>">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- TOKENS ---------- */
:root {
  --ink: #1A1614;
  --surface: #211C19;
  --surface-1: #2A2522;
  --surface-2: #332D29;
  --paper: #E8E2D2;
  --paper-dim: #B8B0A0;
  --paper-low: #807868;
  --rule: #3A3431;
  --strength: #E26B5F;
  --cardio: #6A93C8;
  --mobility: #7BAE83;
  --milestone: #D9A24E;
  --tap-min: 48px;
  --pad: 24px;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.02), 0 12px 32px rgba(0,0,0,0.32);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size: 19px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ---------- TYPE SCALE ---------- */
.serif { font-family: 'Fraunces', Georgia, serif; }
.mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.display-l { font-family: 'Fraunces', serif; font-weight: 900; font-size: 53px; line-height: 1; letter-spacing: -0.02em; }
.display-m { font-family: 'Fraunces', serif; font-weight: 900; font-size: 38px; line-height: 1.05; letter-spacing: -0.015em; }
.display-s { font-family: 'Fraunces', serif; font-weight: 700; font-size: 29px; line-height: 1.1; letter-spacing: -0.01em; }
.headline  { font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; line-height: 1.15; }
.title     { font-weight: 600; font-size: 19px; line-height: 1.3; }
.title-sm  { font-weight: 500; font-size: 17px; line-height: 1.3; }
.body      { font-size: 18px; line-height: 1.5; color: var(--paper); }
.body-dim  { font-size: 17px; line-height: 1.45; color: var(--paper-dim); }
.label     { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-dim); }
.label-sm  { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-low); }
.metric    { font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: var(--paper); }

/* ---------- LAYOUT ---------- */
#app {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 0;
  position: relative;
  padding-bottom: calc(clamp(66px, 9.5vh, 96px) + env(safe-area-inset-bottom) + 16px); /* room for bottom nav */
}
.screen { padding: 56px var(--pad) 24px; min-height: 100vh; min-height: 100dvh; }
.screen.no-nav { padding-bottom: 24px; }
.row { display: flex; align-items: center; }
.row.between { justify-content: space-between; }
.row.gap-8 { gap: 8px; }
.row.gap-12 { gap: 12px; }
.row.gap-16 { gap: 16px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; }
.sp-4  { height: 4px; }
.sp-8  { height: 8px; }
.sp-12 { height: 12px; }
.sp-16 { height: 16px; }
.sp-20 { height: 20px; }
.sp-24 { height: 24px; }
.sp-32 { height: 32px; }
.sp-48 { height: 48px; }
.divider { height: 1px; background: var(--rule); margin: 16px 0; }

/* ---------- BUTTONS / CHIPS ---------- */
button, .btn {
  font-family: inherit;
  font-size: 18px;
  font-weight: 600;
  border: none;
  background: var(--milestone);
  color: var(--ink);
  height: 56px;
  min-width: 64px;
  border-radius: 12px;
  padding: 0 20px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  transition: background 120ms ease, transform 120ms ease;
}
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:active:not(:disabled) { transform: scale(0.98); }
button.secondary { background: var(--surface-1); color: var(--paper); }
button.ghost { background: transparent; color: var(--paper); border: 1px solid var(--rule); }
button.danger { background: transparent; color: var(--strength); border: 1px solid var(--strength); }
button.compact { height: 44px; width: auto; padding: 0 16px; font-size: 17px; }
button.icon { width: 48px; height: 48px; padding: 0; background: transparent; color: var(--paper-dim); border-radius: 12px; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; justify-content: center;
  height: 48px; padding: 0 18px;
  background: var(--surface-1); color: var(--paper-dim);
  border: 1px solid var(--rule); border-radius: 24px;
  font-size: 17px; font-weight: 500; cursor: pointer;
  flex: 1; min-width: 80px;
  transition: all 120ms ease;
}
.chip.active { background: var(--milestone); color: var(--ink); border-color: var(--milestone); font-weight: 600; }
.chip.yes.active { background: var(--mobility); border-color: var(--mobility); }
.chip.no.active  { background: var(--strength); border-color: var(--strength); color: var(--paper); }

/* ---------- FEEL GRID (daily check) ---------- */
.feel-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.feel {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px;
  min-height: 84px;
  padding: 12px 4px;
  background: var(--surface-1);
  border: 1px solid var(--rule);
  border-radius: 14px;
  color: var(--paper-dim);
  cursor: pointer;
  width: 100%;
  transition: all 120ms ease;
}
.feel .feel-face { font-size: 31px; line-height: 1; filter: grayscale(0.35); transition: filter 120ms ease; }
.feel .feel-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--paper-low); }
.feel.active { border-color: var(--milestone); background: var(--surface-2); color: var(--paper); }
.feel.active .feel-face { filter: grayscale(0); transform: scale(1.08); }
.feel.active .feel-label { color: var(--paper); }
/* tint the active label by readiness band */
.feel.feel-5.active .feel-label, .feel.feel-4.active .feel-label { color: var(--mobility); }
.feel.feel-3.active .feel-label { color: var(--milestone); }
.feel.feel-2.active .feel-label, .feel.feel-1.active .feel-label { color: var(--strength); }
.feel.feel-5.active { border-color: var(--mobility); }
.feel.feel-4.active { border-color: var(--mobility); }
.feel.feel-3.active { border-color: var(--milestone); }
.feel.feel-2.active { border-color: var(--strength); }
.feel.feel-1.active { border-color: var(--strength); }

.hurt-toggle {
  width: 100%;
  height: 52px;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 12px;
  color: var(--paper-dim);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms ease;
}
.hurt-toggle.on {
  background: color-mix(in srgb, var(--strength) 16%, transparent);
  border-color: var(--strength);
  color: var(--strength);
  font-weight: 600;
}

/* ---------- CARDS ---------- */
.card {
  background: var(--surface);
  border-radius: 16px;
  padding: 18px 16px;
  border: 1px solid transparent;
}
.card.bordered { border-color: var(--rule); background: transparent; }
.card-block { display: grid; grid-template-columns: 4px 1fr; gap: 14px; align-items: stretch; }
.card-block .stripe { background: var(--paper-dim); border-radius: 2px; min-height: 100%; }
.card-block.mobility  .stripe { background: var(--mobility); }
.card-block.strength  .stripe { background: var(--strength); }
.card-block.cardio    .stripe { background: var(--cardio); }
.card-block.milestone .stripe { background: var(--milestone); }
.card-block.rest      .stripe { background: var(--paper-low); }
.card-block.mobility  .label  { color: var(--mobility); }
.card-block.strength  .label  { color: var(--strength); }
.card-block.cardio    .label  { color: var(--cardio); }
.card-block.milestone .label  { color: var(--milestone); }
.card-block.rest      .label  { color: var(--paper-low); }

.zone {
  display: grid; grid-template-columns: 88px 1fr; gap: 16px;
  padding: 18px 18px; border-radius: 14px; border: 1.5px solid;
  align-items: center;
}
.zone .score { font-family: 'Fraunces', serif; font-weight: 900; font-size: 38px; line-height: 1; }
.zone .label-line { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.zone.green  { border-color: var(--mobility);  background: color-mix(in srgb, var(--mobility) 12%, transparent); }
.zone.green  .score, .zone.green  .label-line { color: var(--mobility); }
.zone.yellow { border-color: var(--milestone); background: color-mix(in srgb, var(--milestone) 12%, transparent); }
.zone.yellow .score, .zone.yellow .label-line { color: var(--milestone); }
.zone.red    { border-color: var(--strength);  background: color-mix(in srgb, var(--strength) 12%, transparent); }
.zone.red    .score, .zone.red    .label-line { color: var(--strength); }

/* ---------- INPUTS ---------- */
.field {
  width: 100%;
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 8px;
}
.field label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-dim); }
.field input[type=text], .field input[type=number], .field input[type=password], .field textarea {
  font-family: inherit; font-size: 19px;
  background: var(--surface-1);
  color: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 14px 16px;
  outline: none;
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
.field input:focus, .field textarea:focus { border-color: var(--milestone); }
.field textarea { resize: vertical; min-height: 80px; }
.field .help { font-size: 14px; color: var(--paper-low); }

/* onboarding wizard progress */
.wiz-head { display: flex; flex-direction: column; gap: 8px; }
.wiz-bar { display: flex; gap: 6px; }
.wiz-seg { flex: 1; height: 6px; border-radius: 999px; background: var(--rule); transition: background 260ms ease; }
.wiz-seg.on { background: var(--milestone); }
.wiz-step { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-dim); }
.adv { margin-top: 2px; }
.adv summary { cursor: pointer; color: var(--paper-dim); font-size: 14px; font-family: 'IBM Plex Mono', monospace; }
.plan-preview { background: color-mix(in srgb, var(--mobility) 12%, transparent); border: 1px solid var(--mobility); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.crown { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; background: color-mix(in srgb, var(--ink) 88%, transparent); animation: fade-in 240ms ease; }

/* brand logo (homepage) */
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
.brand-logo { width: clamp(76px, 24vw, 104px); height: clamp(76px, 24vw, 104px); object-fit: contain; margin-bottom: 10px; }

/* unit toggle + auto-conversion */
.unit-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { height: 30px; min-width: 0; width: auto; padding: 0 14px; background: transparent; color: var(--paper-dim); font-size: 13px; font-weight: 600; border: none; border-radius: 0; }
.seg button.on { background: var(--milestone); color: var(--ink); }
.conv-wrap { position: relative; display: flex; align-items: center; }
.conv-wrap input { padding-right: 96px; }
.conv { position: absolute; right: 16px; color: var(--paper-low); font-family: 'IBM Plex Mono', monospace; font-size: 14px; pointer-events: none; white-space: nowrap; }

/* radio cards */
.radio-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  margin-bottom: 8px;
  display: grid; grid-template-columns: 24px 1fr; gap: 14px; align-items: center;
  transition: border-color 120ms ease, background 120ms ease;
}
.radio-card.selected { border-color: var(--milestone); background: var(--surface-1); }
.radio-card .dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--paper-dim); display: flex; align-items: center; justify-content: center;
}
.radio-card.selected .dot { border-color: var(--milestone); }
.radio-card.selected .dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--milestone); }

/* slider */
.slider-row { padding: 10px 0; }
.slider-row .top { display: flex; align-items: center; justify-content: space-between; }
.slider-row .top .name { font-weight: 600; font-size: 19px; }
.slider-row .top .val  { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; color: var(--milestone); }
.slider-row input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 48px;
  background: transparent; outline: none; cursor: pointer;
}
.slider-row input[type=range]::-webkit-slider-runnable-track {
  height: 4px; background: var(--rule); border-radius: 4px;
}
.slider-row input[type=range]::-moz-range-track {
  height: 4px; background: var(--rule); border-radius: 4px;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--milestone);
  margin-top: -12px;
  cursor: pointer;
  border: 4px solid var(--ink);
}
.slider-row input[type=range]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--milestone);
  cursor: pointer;
  border: 4px solid var(--ink);
}
.slider-row .anchors { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: var(--paper-low); text-transform: uppercase; margin-top: -8px; }

/* switch */
.switch-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
}
.switch-row .info .name { font-weight: 600; font-size: 19px; }
.switch-row .info .help { font-size: 16px; color: var(--paper-dim); margin-top: 2px; }
.switch {
  --w: 52px;
  --h: 30px;
  position: relative; display: inline-block; width: var(--w); height: var(--h);
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; cursor: pointer; background: var(--surface-1);
  border: 1px solid var(--rule); border-radius: 999px; transition: 0.2s;
}
.switch .slider::before {
  position: absolute; content: ''; width: 22px; height: 22px; left: 3px; bottom: 3px;
  background: var(--paper-dim); border-radius: 50%; transition: 0.2s;
}
.switch input:checked + .slider { background: var(--mobility); border-color: var(--mobility); }
.switch input:checked + .slider::before { transform: translateX(22px); background: var(--ink); }

/* ---------- BOTTOM NAV ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--rule);
  display: flex; align-items: stretch;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav .tab {
  flex: 1; height: clamp(66px, 9.5vh, 96px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(4px, 0.9vh, 8px);
  background: transparent; border: none; color: var(--paper-low); cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; font-size: clamp(11px, calc(7px + 1.4vw), 15px); letter-spacing: 0.08em; text-transform: uppercase;
  width: auto; border-radius: 0;
}
.nav .tab.active { color: var(--milestone); }
.nav .tab svg { width: clamp(24px, calc(14px + 3.4vw), 34px); height: clamp(24px, calc(14px + 3.4vw), 34px); }

/* ---------- HEADER ---------- */
.screen-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.screen-head .crumb { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-dim); }
.back-row { display: flex; align-items: center; gap: 8px; margin-left: -8px; margin-bottom: 12px; }
.back-row button { background: transparent; color: var(--paper-dim); height: 40px; width: auto; padding: 0 8px; font-size: 17px; gap: 4px; }
.back-row button:hover { color: var(--paper); }

/* ---------- TOAST ---------- */
.toast {
  position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
  background: var(--surface-2); color: var(--paper); padding: 12px 18px;
  border-radius: 12px; font-size: 17px; border: 1px solid var(--rule);
  z-index: 100; box-shadow: var(--shadow-card);
  opacity: 0; transition: opacity 200ms ease;
  pointer-events: none; max-width: 360px;
  text-align: center;
}
.toast.show { opacity: 1; }
.toast.error { border-color: var(--strength); color: var(--strength); }
.toast.success { border-color: var(--mobility); color: var(--mobility); }

/* ---------- LIBRARY / EXERCISE ---------- */
.lib-row {
  display: grid; grid-template-columns: 56px 1fr 16px;
  gap: 12px; align-items: center;
  padding: 10px;
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid transparent;
  cursor: pointer;
  margin-bottom: 8px;
  text-align: left;
  width: 100%;
  height: auto;
  color: var(--paper);
  font-weight: 400;
}
.lib-row:hover { border-color: var(--rule); }
.lib-row .fig {
  width: 56px; height: 56px;
  background: var(--surface-1);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.lib-row .fig svg { width: 44px; height: 44px; color: var(--paper); }
.lib-row .text { display: flex; flex-direction: column; }
.lib-row .text .name { font-size: 18px; font-weight: 600; color: var(--paper); }
.lib-row .text .rx { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper-dim); margin-top: 2px; }
.lib-row .chev { color: var(--paper-low); }

.cat-header { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--milestone); margin-top: 16px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }

/* exercise detail */
.fig-hero {
  background: var(--surface-1);
  border-radius: 18px;
  height: clamp(184px, 48vw, 240px);
  display: flex; align-items: center; justify-content: center;
  margin: 12px 0;
}
.fig-hero svg { height: 170px; width: 170px; color: var(--paper); }
.fig-hero .afig { width: clamp(150px, 42vw, 196px) !important; height: clamp(150px, 42vw, 196px) !important; }
.fig-hero .afig svg { width: 100% !important; height: 100% !important; }
.step-list { display: grid; grid-template-columns: 28px 1fr; gap: 8px 12px; }
.step-list .n { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper-low); padding-top: 3px; }
.step-list .t { font-size: 17px; color: var(--paper); line-height: 1.5; padding-bottom: 6px; }

/* ---------- ANIMATED FIGURE ---------- */
.afig { position: relative; display: inline-block; color: var(--paper); line-height: 0; }
.afig svg { display: block; }
.afig svg.b, .afig svg.c { position: absolute; inset: 0; opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .afig.anim svg.a { animation: afigA 1.9s ease-in-out infinite; }
  .afig.anim svg.b { animation: afigB 1.9s ease-in-out infinite; }
  /* 3-frame flip-book (walk/run): plays a→b→c then reverses (shared passing frame = clean gait) */
  .afig.anim3 svg.a { animation: afig3a 0.85s ease-in-out infinite alternate; }
  .afig.anim3 svg.b { animation: afig3b 0.85s ease-in-out infinite alternate; }
  .afig.anim3 svg.c { animation: afig3c 0.85s ease-in-out infinite alternate; }
}
@keyframes afigA { 0%,28% { opacity: 1; } 50%,78% { opacity: 0; } 100% { opacity: 1; } }
@keyframes afigB { 0%,28% { opacity: 0; } 50%,78% { opacity: 1; } 100% { opacity: 0; } }
@keyframes afig3a { 0% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes afig3b { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
@keyframes afig3c { 0%,50% { opacity: 0; } 100% { opacity: 1; } }

/* ---------- TODAY: EXPANDABLE PRESCRIPTION ---------- */
.today-block { width: 100%; text-align: left; background: transparent; border: none; padding: 0; margin: 0; display: block; height: auto; color: var(--paper); cursor: pointer; }
.rx-head { display: grid; grid-template-columns: 1fr 20px; gap: 10px; align-items: center; }
.rx-chev { color: var(--paper-low); transition: transform 220ms ease; display: flex; align-items: center; justify-content: center; }
.today-block[aria-expanded="true"] .rx-chev { transform: rotate(90deg); }
.ex-panel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 340ms ease, opacity 240ms ease; }
.ex-panel.open { max-height: 4000px; opacity: 1; margin-top: 10px; }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 8px; }
.ex-card { display: grid; grid-template-columns: 46px 1fr 32px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px; }
.ex-card.done { opacity: 0.5; }
.ex-card .fig { width: 46px; height: 46px; background: var(--surface-1); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ex-check { width: 30px; height: 30px; min-width: 0; padding: 0; border-radius: 50%; border: 2px solid var(--rule); background: var(--surface-1); color: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; align-self: center; }
.ex-check svg { width: 16px; height: 16px; }
.ex-card.done .ex-check { background: var(--mobility); border-color: var(--mobility); color: var(--ink); }
.ex-done-label { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mobility); margin: 12px 0 6px; }
.ex-done-label svg { width: 14px; height: 14px; }
.markall { width: 100%; height: 44px; margin-top: 8px; background: var(--surface-1); color: var(--paper); border: 1px solid var(--rule); border-radius: 12px; font-size: 14px; font-weight: 600; }
.rx-count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--mobility); white-space: nowrap; }
/* body map (injury) */
.bodymap { width: clamp(150px, 48vw, 210px); height: auto; display: block; margin: 0 auto 12px; }
.bm-seg { fill: var(--surface-1); stroke: var(--paper-dim); stroke-width: 1; cursor: pointer; transition: fill 120ms ease; }
.bm-seg:hover { fill: var(--surface-2); }
.bm-seg.sel { fill: var(--strength); stroke: var(--strength); }
.bm-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bm-chip { height: 38px; padding: 0 14px; min-width: 0; width: auto; border-radius: 20px; border: 1px solid var(--rule); background: var(--surface-1); color: var(--paper-dim); font-size: 14px; font-weight: 500; }
.bm-chip.sel { background: var(--strength); border-color: var(--strength); color: var(--paper); }
/* activity log */
.logrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.logtime { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--paper-low); }
.logbody { font-size: 14px; color: var(--paper); line-height: 1.45; }
.logtype { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; margin-right: 8px; background: var(--surface-2); color: var(--paper-dim); }
.logtype.progress { color: var(--mobility); } .logtype.injury { color: var(--strength); } .logtype.layoff { color: var(--milestone); } .logtype.sync, .logtype.persona { color: var(--cardio); } .logtype.profile { color: var(--milestone); }
.ex-card .meta .name { font-size: 17px; font-weight: 600; color: var(--paper); }
.ex-card .meta .rx { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper-dim); margin-top: 2px; }
.ex-card .meta .cue { font-size: 14px; color: var(--paper-dim); margin-top: 6px; line-height: 1.4; }
.ex-card .meta .more { display: inline-block; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: var(--milestone); background: transparent; border: none; padding: 0; height: auto; min-width: 0; width: auto; cursor: pointer; }

/* ---------- CHART ---------- */
.chart {
  background: var(--surface);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.chart .top { display: flex; justify-content: space-between; align-items: baseline; }
.chart canvas { width: 100%; height: 120px; display: block; margin-top: 8px; }
.chart .bottom { display: flex; justify-content: space-between; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper-dim); }
.chart .empty { display: flex; align-items: center; justify-content: center; height: 120px; color: var(--paper-low); font-size: 16px; }

/* status pip */
.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--paper-low); letter-spacing: 0.08em; text-transform: uppercase;
}
.sync::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--paper-low);
}
.sync.online::before { background: var(--mobility); }
.sync.offline::before { background: var(--milestone); }
.sync.error::before { background: var(--strength); }
.sync.syncing::before {
  background: var(--cardio);
  animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ---------- SCREEN MOTION ---------- */
.screen { animation: fade-in 180ms ease; }
@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- REDUCED MOTION ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- TOUCH / MOBILE ---------- */
button, .btn, .chip, .feel, .lib-row, .today-block, .radio-card, .nav .tab, .seg button, .more, .hurt-toggle, .icon, .switch {
  touch-action: manipulation;          /* no 300ms tap delay, no double-tap zoom */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.brand-logo { -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }
html, body { overscroll-behavior-y: contain; }   /* no pull-to-refresh bounce in the PWA */
@media (max-width: 380px) {
  :root { --pad: 18px; }
  .screen { padding-top: 44px; }
}
</style>
</head>

<script id="app-script">
/* ============================================================
   FOUNDATION PROTOCOL — single-file web app (simplified)
   Two taps a day. No typing after onboarding.
   Q1: Did you meet today's goal?   Q2: How do you feel?
   → one of four calls: PROGRESS · REPEAT · MODIFY · REST
   Persists to a GitHub repo via the Contents API.
   ============================================================ */

'use strict';

// ============================================================
// CONFIG
// ============================================================
const APP_VERSION = '2.1.0';
const STORAGE_KEY = 'foundation-protocol-state-v2';        // legacy single-user blob (migrated on load)
const SETTINGS_KEY = 'foundation-protocol-settings-v2';
const ACTIVE_KEY = 'foundation-protocol-active-user';
const DATA_KEYS = ['profile', 'phase', 'checks'];
// "Sign in with GitHub" (OAuth device flow). Fill these once after the 5-min setup in docs/SETUP-OAUTH.md.
// GH_CLIENT_ID = your GitHub OAuth App client id (public, safe to embed). GH_OAUTH_PROXY = the deployed CORS worker URL.
const GH_CLIENT_ID = '';
const GH_OAUTH_PROXY = '';
function oauthEnabled() { return !!(GH_CLIENT_ID && GH_OAUTH_PROXY); }
// Each persona's data lives in its own folder: data/users/<slug>/{profile,phase,checks}.json
function slugify(s) { return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
function activeSlug() { return state.activeUser || (state.profile && state.profile.usernameSlug) || ''; }
function userStateKey(slug) { return `${STORAGE_KEY}:${slug}`; }
function dataPath(key) { return `data/users/${activeSlug() || 'default'}/${key}.json`; }
// Unit conversion (imperial default)
const LB_PER_KG = 2.2046226218;
function lbToKg(lb) { return lb / LB_PER_KG; }
function kgToLb(kg) { return kg * LB_PER_KG; }
function fmt1(n) { return (Math.round(n * 10) / 10).toString(); }

// ============================================================
// STATE
// ============================================================

function exercisesForBlock(key) { return (BLOCK_EX[key] || []).map(k => EXERCISES.find(e => e.key === k)).filter(Boolean); }

// ---- Per-day exercise completion (workout flow) ----
function ensureSession() { const d = isoToday(); if (!state.session || state.session.date !== d) state.session = { date: d, done: {} }; return state.session; }
function todayExerciseKeys() { const ks = []; currentDayPlan().blocks.forEach(b => exercisesForBlock(b.key).forEach(ex => { if (!ks.includes(ex.key)) ks.push(ex.key); })); return ks; }
function exDone(key) { return !!(state.session && state.session.done && state.session.done[key]); }
function toggleEx(key) { ensureSession(); if (state.session.done[key]) delete state.session.done[key]; else state.session.done[key] = true; saveLocal(); }
function markBlockDone(blockKey) { ensureSession(); exercisesForBlock(blockKey).forEach(ex => { state.session.done[ex.key] = true; }); saveLocal(); }
function sessionCounts() { ensureSession(); const ks = todayExerciseKeys(); return { done: ks.filter(k => state.session.done[k]).length, total: ks.length }; }

// ---- Time-aware detraining / layoff (evidence: tendon de-adapts ~2mo; run restarts more conservatively than strength) ----
function lastCheckDate() { for (let i = state.checks.length - 1; i >= 0; i--) { if (state.checks[i] && state.checks[i].date) return state.checks[i].date; } return null; }
function daysSinceLastCheck() { const d = lastCheckDate(); if (!d) return 0; const ms = Date.now() - new Date(d + 'T12:00:00').getTime(); return Math.max(0, Math.floor(ms / 86400000)); }
function layoffTier() {
  const g = daysSinceLastCheck();
  if (g < 15) return null;
  if (g < 29) return { gap: g, level: 1, pct: 85, title: 'Welcome back', msg: `${g} days off. Ease in: ~15% lighter today, rebuild over a week. Hold running at your last tolerated run-walk, not your best.` };
  if (g < 57) return { gap: g, level: 2, pct: 70, title: 'Easing back in', msg: `${g} days off (~1-2 months). Start ~30% lighter, higher reps, +10%/week. Running throttles back to early run-walk intervals — tendons de-adapt faster than your heart and muscle.` };
  return { gap: g, level: 3, pct: 60, title: 'Restart, smartly', msg: `${g}+ days off. Start ~40% lighter and rebuild running from the run-walk start, regardless of your old level. Muscle memory means it comes back much faster the second time.` };
}

// ---- Deload (evidence: lighter week every ~4-6 weeks; or early on under-recovery trend) ----
function underRecoveryTrend() {
  const recent = state.checks.slice(-7);
  if (recent.length < 4) return false;
  const flags = recent.filter(c => c.feel <= 2 || c.decision === 'modify' || c.decision === 'repeat').length;
  return flags >= 3;
}
function isDeloadWeek() { const wk = state.phase?.week ?? 1; const ph = state.phase?.phase ?? 0; return ph >= 1 && wk > 0 && wk % 5 === 0; }
function deloadActive() { return isDeloadWeek() || underRecoveryTrend(); }

// ---- Injury (PEACE & LOVE / overuse loading; red-flag screen) ----
const BODY_PARTS = ['neck','shoulder','upper back','lower back','elbow','wrist','hip','groin','glute','quad','hamstring','knee','shin','calf','ankle','foot'];
function injuryActive() { return !!(state.injury && (!state.injury.clearedAt)); }
function injuryInRice() { return injuryActive() && state.injury.riceUntil && Date.now() < state.injury.riceUntil; }
function clearInjury() { if (state.injury) { state.injury.clearedAt = Date.now(); } state.injury = null; saveLocal(); }
// A call that persists across the days it covers (e.g. an injury rest spans the whole protect window).
function standingCall() {
  if (!injuryActive()) return null;
  const since = state.injury.since || Date.now();
  const days = Math.max(1, Math.round((state.injury.riceUntil - since) / 86400000));
  const dayNum = Math.min(days, Math.floor((Date.now() - since) / 86400000) + 1);
  const parts = (state.injury.parts || []).join(', ') || 'injury';
  if (injuryInRice()) return { cls: 'strength', label: `Recovering · ${parts} · day ${dayNum} of ${days}`, title: 'Rest & protect', action: 'Protect &amp; gently load the area — keep moving everything that does not hurt (PEACE &amp; LOVE).' };
  return { cls: 'milestone', label: `Recovering · ${parts} · easing back`, title: 'Ease back in', action: 'Pain-monitored loading — keep pain at or under ~3–5/10 and gone by next morning.' };
}

function decide(goalMet, feel, hurt) {
  if (hurt) {
    return { ...OUTCOMES.rest,
      title: 'Stop. Rest and check the pain.',
      why: 'Sharp pain is not training stress. Take today off entirely. If the same sharp pain is still there after a few days, or it is point-tender on the bone, see a physio before resuming. ' + OUTCOMES.rest.why };
  }
  if (feel <= 1) return OUTCOMES.rest;
  if (feel === 2) return OUTCOMES.modify;
  if (goalMet === 'done') return feel >= 4 ? OUTCOMES.progress : OUTCOMES.repeat;
  return OUTCOMES.repeat;
}

function modifyBlock(block) {
  switch (block.kind) {
    case 'strength': return { title: block.title, detail: 'Easiest variation, no added load. Incline pushups, bodyweight squats, shorter holds.' };
    case 'cardio':
      if (/run/i.test(block.title) || /run/i.test(block.label))
        return { title: 'Run-walk or walk', detail: 'Drop the running. Walk, or gentle run-walk intervals for the same time.' };
      return { title: 'Short easy walk', detail: '15 to 20 minutes, conversational. Nothing more.' };
    case 'mobility': return { title: block.title, detail: 'Painless items only. Skip anything that aggravates.' };
    case 'milestone': return { title: block.title, detail: block.detail };
    default: return { title: 'Rest', detail: 'Sleep, hydrate, protein.' };
  }
}

// PROGRESSION
// ============================================================
function currentPhaseDef() { return PHASES[(state.phase?.phase ?? state.profile?.startingPhase ?? 0)]; }
function currentDayPlan() {
  const pd = currentPhaseDef();
  const idx = ((state.phase?.dayInWeek ?? 1) - 1);
  return pd.week[Math.max(0, Math.min(idx, pd.week.length - 1))];
}
function advancePointer() {
  const cur = state.phase || { phase: 0, week: 1, dayInWeek: 1, sessionsCleared: 0, lastDecision: null };
  const pd = PHASES[cur.phase];
  let { phase, week, dayInWeek } = cur;
  dayInWeek += 1;
  if (dayInWeek > pd.week.length) {
    dayInWeek = 1; week += 1;
    if (week > pd.totalWeeks) { week = 1; phase = Math.min(phase + 1, PHASES.length - 1); }
  }
  state.phase = { phase, week, dayInWeek, sessionsCleared: (cur.sessionsCleared ?? 0) + 1, lastDecision: new Date().toISOString() };
}

  action: 'Offload the painful movement today. Keep moving everything that does not hurt.',
  why: 'For a fresh tweak, current guidance is PEACE & LOVE, not RICE: Protect (briefly offload), Elevate, Avoid anti-inflammatories/ice as a "healing" step, Compress, Educate — then over the next days gently Load, stay Optimistic, do easy pain-free cardio (Vascularization) and graded Exercise. Gentle early loading beats prolonged rest (BJSM 2019/2020). Prefer paracetamol over NSAIDs for pain; re-check tomorrow.' };
const INJURY_FLAG = { key: 'rest', title: 'See a clinician first', cls: 'strength',
  action: 'Hold off and get this looked at before training it.',
  why: 'You flagged a warning sign — cannot bear weight, bone-point tenderness, numbness, deformity, joint locking/giving way, a "pop", or rapid swelling. Any of these warrants a professional check (GP, physio, urgent care), and it matters more at 40+ where fracture and medication-interaction risk are higher. Resume the plan once cleared.' };

function applyCheck(goalMet, feel, hurt, parts, redFlag) {
  let outcome = decide(goalMet, feel, hurt);
  const cur = state.phase || {};
  const today = isoToday();
  // --- Injury handling (PEACE & LOVE / red-flag screen) ---
  const wasInRice = injuryInRice();
  if (hurt) {
    outcome = redFlag ? INJURY_FLAG : INJURY_REST;
    state.injury = { parts: parts || [], since: Date.now(), riceUntil: Date.now() + 3 * 86400000, kind: 'acute', redFlag: !!redFlag };
  } else if (injuryActive()) {
    // re-checked with no pain: the injury is settling — clear it and resume
    state.injury = null;
  }
  // --- Ease back: no load jump on the first session back after a layoff or within the injury-protect window ---
  const lay = layoffTier();
  if (!hurt && outcome.key === 'progress' && (lay || wasInRice)) outcome = OUTCOMES.repeat;
  const existingIdx = state.checks.findIndex(c => c.date === today);
  const alreadyCheckedToday = existingIdx >= 0;
  const entry = {
    ts: Date.now(), date: today, goalMet, feel, hurt: !!hurt, parts: parts || [],
    decision: outcome.key, phase: cur.phase ?? 0, week: cur.week ?? 1, dayInWeek: cur.dayInWeek ?? 1,
  };
  if (alreadyCheckedToday) state.checks[existingIdx] = entry; else state.checks.push(entry);
  // advance at most once per local day, only on Progress, never while hurt/injured
  const willAdvance = outcome.key === 'progress' && !alreadyCheckedToday;
  if (willAdvance) {
    advancePointer();
  } else {
    if (!state.phase) state.phase = { phase: 0, week: 1, dayInWeek: 1, sessionsCleared: 0, lastDecision: null };
    state.phase.lastDecision = new Date().toISOString();
  }
  // --- audit log ---
  const pl = (parts && parts.length) ? ` [${parts.join(', ')}${redFlag ? '; red flag' : ''}]` : '';
  logEvent('check', `Goal ${goalMet}, feel ${feel}/5${hurt ? ' · hurt' + pl : ''} → ${outcome.title}`);
  if (willAdvance) logEvent('progress', `Advanced → Phase ${state.phase.phase} · Wk ${state.phase.week} · Session ${state.phase.dayInWeek}`);
  if (hurt) logEvent('injury', `Injury logged${pl}${redFlag ? ' — routed to clinician' : ''}`);
  else if (lay) logEvent('layoff', `${lay.gap} days off — eased back in (no load jump)`);
  markDirty('checks', 'phase');
  return outcome;
}

  try {
    const raw = localStorage.getItem(userStateKey(slug));
    if (raw) { const d = JSON.parse(raw); state.profile = d.profile || null; state.phase = d.phase || null; state.checks = d.checks || []; state.pending = d.pending || []; state.session = d.session || null; state.injury = d.injury || null; state.log = d.log || []; }

function loadLocal() {
  try {

    if (sraw) state.settings = { ...state.settings, ...JSON.parse(sraw) };
    // Migrate a pre-persona single-user blob into a named persona once.
    const legacy = localStorage.getItem(STORAGE_KEY);

      try {
        const d = JSON.parse(legacy);

    }

}
function saveLocal() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));

      state.activeUser = slug;
      localStorage.setItem(ACTIVE_KEY, slug);

function markDirty(...keys) {
  keys.forEach(k => { if (!state.pending.includes(k)) state.pending.push(k); });

// ---------- GitHub API ----------
function ghUrl(path) { return `https://api.github.com/repos/${state.settings.repo}/contents/${path}`; }
function ghHeaders() { return { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Authorization': `Bearer ${state.settings.pat}` }; }
function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s) { return decodeURIComponent(escape(atob(s.replace(/\s/g, '')))); }
const fileShaCache = {};
async function ghGetRaw(path) {
  // no-store: GitHub sends Cache-Control max-age on authed GETs; the browser would
  // otherwise serve a stale sha/content and defeat conflict-retry and fresh pulls.
  const resp = await fetch(ghUrl(path), { headers: ghHeaders(), cache: 'no-store' });
  if (resp.status === 404) return null;
  if (resp.status === 401 || resp.status === 403) throw new Error('GitHub auth failed — check the token (needs Contents: Read & Write).');
  if (!resp.ok) throw new Error(`GitHub GET ${path} → ${resp.status}`);
  const json = await resp.json();
  fileShaCache[path] = json.sha;
  return { content: JSON.parse(b64decode(json.content)), sha: json.sha };
}
async function ghGet(path) { const r = await ghGetRaw(path); return r ? r.content : null; }
async function ghPut(path, data) {
  let sha = fileShaCache[path];
  if (!sha) { try { const r = await ghGetRaw(path); if (r) sha = r.sha; } catch (_) {} }
  const send = (useSha) => {
    const body = { message: `Update ${path}`, content: b64encode(JSON.stringify(data, null, 2)) };
    if (useSha) body.sha = useSha;
    return fetch(ghUrl(path), { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  };
  let resp = await send(sha);
  if (resp.status === 409 || resp.status === 422) {
    // stale sha (file changed on another device / the web UI) — refresh and retry once
    delete fileShaCache[path];
    let fresh = null;
    try { const r = await ghGetRaw(path); if (r) fresh = r.sha; } catch (_) {}
    resp = await send(fresh);
  }
  if (!resp.ok) { const t = await resp.text(); throw new Error(`GitHub PUT ${path} → ${resp.status}: ${t.slice(0,200)}`); }
  const json = await resp.json();
  fileShaCache[path] = json.content.sha;
}
function isConfigured() { return Boolean(state.settings.repo && state.settings.pat); }

async function ghSignIn() {
  if (!oauthEnabled()) { toast('GitHub sign-in is not set up yet','error'); return; }
  const base = GH_OAUTH_PROXY.replace(/\/$/, '');
  state._signinCancel = false;
  try {
    setSync('syncing', 'Starting GitHub sign-in');
    const r = await fetch(base + '/device/code', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ client_id: GH_CLIENT_ID, scope: 'repo' }) });
    const d = await r.json();
    if (!d.device_code) throw new Error('Could not start sign-in');
    const uri = d.verification_uri || 'https://github.com/login/device';
    showDeviceModal(d.user_code, uri);
    try { window.open(uri, '_blank'); } catch (_) {}
    const token = await ghPollToken(base, d.device_code, d.interval || 5, d.expires_in || 900);
    hideDeviceModal();
    if (state._signinCancel) return;
    if (!token) { setSync('error', 'Sign-in timed out'); toast('Sign-in timed out — try again','error'); return; }
    state.settings.pat = token;
    const me = await fetch('https://api.github.com/user', { headers: ghHeaders() }).then(x => x.json());
    const login = me && me.login ? me.login : '';
    if (login) await ghEnsureDataRepo(login);
    saveLocal();
    if (login) logEvent('persona', `Connected GitHub as ${login}`);
    if (state._onb && !slugify(state._onb.username) && login) { state._onb.username = login; }
    if (state.profile && !state.profile.username && login) { state.profile.username = login; state.profile.usernameSlug = slugify(login); }
    setSync('online', 'Connected');
    toast('Connected to GitHub as ' + (login || 'you'), 'success');
    render();
  } catch (e) { console.error(e); hideDeviceModal(); setSync('error', e.message); toast('Sign-in failed — try again', 'error'); }
}
async function ghPollToken(base, device_code, interval, expires) {
  const end = Date.now() + expires * 1000; let wait = Math.max(5, interval) * 1000;
  while (Date.now() < end) {
    await new Promise(r => setTimeout(r, wait));
    try {
      const r = await fetch(base + '/access_token', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ client_id: GH_CLIENT_ID, device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' }) });
      const d = await r.json();
      if (d.access_token) return d.access_token;
      if (d.error === 'slow_down') wait += 5000;
      else if (d.error && d.error !== 'authorization_pending') return null;
    } catch (_) { /* keep polling */ }
  }
  return null;
}
async function ghEnsureDataRepo(login) {
  state.settings.repo = `${login}/foundation-protocol-data`;
  try {
    const check = await fetch(`https://api.github.com/repos/${state.settings.repo}`, { headers: ghHeaders() });
    if (check.status === 404) {
      await fetch('https://api.github.com/user/repos', { method:'POST', headers:{ ...ghHeaders(), 'Content-Type':'application/json' }, body: JSON.stringify({ name: 'foundation-protocol-data', private: true, auto_init: true, description: 'My Foundation Protocol training data' }) });
    }
  } catch (_) {}
}
function mergeChecks(remote, local) {
  const byTs = new Map();
  (Array.isArray(remote) ? remote : []).forEach(c => { if (c && c.ts != null) byTs.set(c.ts, c); });
  (Array.isArray(local)  ? local  : []).forEach(c => { if (c && c.ts != null) byTs.set(c.ts, c); }); // local wins ties
  return [...byTs.values()].sort((a, b) => a.ts - b.ts);
}
async function syncFromRemote() {
  if (!isConfigured() || !activeSlug()) return;
  setSync('syncing', 'Loading from GitHub');
  try {
    const [profile, phase, checks] = await Promise.allSettled([ ghGet(dataPath('profile')), ghGet(dataPath('phase')), ghGet(dataPath('checks')) ]);
    if (profile.status === 'fulfilled' && profile.value) state.profile = profile.value;
    if (phase.status   === 'fulfilled' && phase.value)   state.phase   = phase.value;
    if (checks.status  === 'fulfilled' && Array.isArray(checks.value)) state.checks = checks.value;
    const failed = [profile, phase, checks].find(r => r.status === 'rejected');
    saveLocal();
    if (failed) setSync('error', (failed.reason && failed.reason.message) ? failed.reason.message : 'Sync issue');
    else setSync('online', 'Synced');
  } catch (e) { console.error(e); setSync('error', e.message); }
}
let _syncing = false, _syncQueued = false;
async function syncToRemote() {
  if (!isConfigured() || !activeSlug() || state.pending.length === 0) return;
  if (_syncing) { _syncQueued = true; return; }      // serialize: avoid overlapping push loops
  _syncing = true;
  setSync('syncing', `Pushing ${state.pending.length} change${state.pending.length===1?'':'s'}`);
  try {
    for (const key of [...state.pending]) {
      if (key === 'checks') {
        // union with any checks pushed from another device so cross-device entries are never clobbered
        try { const remote = await ghGet(dataPath('checks')); if (Array.isArray(remote)) state.checks = mergeChecks(remote, state.checks); } catch (_) {}
      }
      await ghPut(dataPath(key), state[key]);
      state.pending = state.pending.filter(k => k !== key);
      saveLocal();
    }
    setSync('online', 'Synced');
  } catch (e) { console.error(e); setSync('error', e.message); }
  finally {
    _syncing = false;
    if (_syncQueued) { _syncQueued = false; if (state.pending.length) syncToRemote(); }
  }
}
function setSync(status, message) {
  state.ui.syncStatus = status; state.ui.syncMessage = message;
  document.querySelectorAll('.sync').forEach(el => {
    el.className = 'sync ' + status;
    el.textContent = status === 'error' ? 'Sync issue' : status === 'syncing' ? 'Syncing…' : status === 'online' ? 'Synced' : (isConfigured() ? 'Idle' : 'Local only');
  });
}

function isoToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function escHtml(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function svgUse(id, size) { const s = size||24; return `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${escHtml(id)}"/></svg>`; }
function animatedFigure(ex, size) {
  const s = size || 44;
  const frames = (ex && ex.frames && ex.frames.length) ? ex.frames : [ex.icon];
  const svg = (cls, id) => `<svg class="${cls}" width="${s}" height="${s}" aria-hidden="true"><use href="#${escHtml(id)}"/></svg>`;
  const box = (cls, inner) => `<span class="${cls}" style="width:${s}px;height:${s}px;">${inner}</span>`;
  if (frames.length >= 3) return box('afig anim3', svg('a',frames[0]) + svg('b',frames[1]) + svg('c',frames[2]));
  if (frames.length === 2) return box('afig anim', svg('a',frames[0]) + svg('b',frames[1]));
  return box('afig', svg('a', frames[0]));
}
function toast(message, kind) {
  const el = document.getElementById('toast');
  el.className = 'toast ' + (kind||'');
  el.textContent = message;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

const backStack = [];
function navigate(screen, params) {
  if (state.ui.screen && state.ui.screen !== screen && state.ui.screen !== 'loading') {
    backStack.push({ screen: state.ui.screen, params: state.ui.params });
    if (backStack.length > 20) backStack.shift();
  }
  state.ui.screen = screen; state.ui.params = params || {};
  render(); window.scrollTo(0,0);
}
function goBack(fallback) {
  if (backStack.length > 0) { const prev = backStack.pop(); state.ui.screen = prev.screen; state.ui.params = prev.params; render(); window.scrollTo(0,0); }
  else navigate(fallback || 'today');
}
function render() {
  const root = document.getElementById('app');
  const screen = state.ui.screen;
  const tabScreens = ['today','library','progress','phase'];
  let html = '';
  switch (screen) {
    case 'onboarding':     html = renderOnboarding(); break;
    case 'today':          html = renderToday(); break;
    case 'check':          html = renderCheck(); break;
    case 'result':         html = renderResult(state.ui.params.outcome); break;
    case 'library':        html = renderLibrary(); break;
    case 'progress':       html = renderProgress(); break;
    case 'phase':          html = renderPhaseList(); break;
    case 'phaseDetail':    html = renderPhaseDetail(state.ui.params.index); break;
    case 'exerciseDetail': html = renderExerciseDetail(state.ui.params.key); break;
    case 'settings':       html = renderSettings(); break;
    case 'log':            html = renderLog(); break;
    default:               html = renderLoading();
  }
  if (tabScreens.includes(screen)) html += renderNav(screen);
  root.innerHTML = html;
  bindEvents();
  setSync(state.ui.syncStatus, state.ui.syncMessage);
}
function renderNav(active) {
  return `<nav class="nav">
    <button class="tab ${active==='today'?'active':''}" data-go="today">${svgUse('ic-today',22)}<span>Today</span></button>
    <button class="tab ${active==='library'?'active':''}" data-go="library">${svgUse('ic-library',22)}<span>Library</span></button>
    <button class="tab ${active==='progress'?'active':''}" data-go="progress">${svgUse('ic-progress',22)}<span>Progress</span></button>
    <button class="tab ${active==='phase'?'active':''}" data-go="phase">${svgUse('ic-phase',22)}<span>Phase</span></button>
  </nav>`;
}
function bindEvents() {
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    const target = el.getAttribute('data-go');
    const params = {};
    for (const a of el.attributes) if (a.name.startsWith('data-p-')) params[a.name.slice(7)] = a.value;
    navigate(target, params);
  }));
  document.querySelectorAll('[data-back]').forEach(el => el.addEventListener('click', () => goBack('today')));
  document.querySelectorAll('[data-exp]').forEach(el => el.addEventListener('click', () => {
    const i = el.getAttribute('data-exp');
    const panel = document.getElementById('ex-panel-' + i);
    if (!panel) return;
    const open = panel.classList.toggle('open');
    el.setAttribute('aria-expanded', open ? 'true' : 'false');
    state.ui.openBlocks[i] = open;   // persist so it survives re-renders
  }));
  document.querySelectorAll('[data-exp-why]').forEach(el => el.addEventListener('click', () => {
    const panel = document.getElementById('why-panel');
    if (!panel) return;
    const open = panel.classList.toggle('open');
    el.setAttribute('aria-expanded', open ? 'true' : 'false');
    state.ui.whyOpen = open;
  }));
  document.querySelectorAll('[data-toggle-ex]').forEach(el => el.addEventListener('click', () => { toggleEx(el.getAttribute('data-toggle-ex')); render(); }));
  document.querySelectorAll('[data-markall]').forEach(el => el.addEventListener('click', () => { markBlockDone(el.getAttribute('data-markall')); render(); }));
}

function bindOnboarding() {
  const get = id => document.getElementById(id);
  const next = get('onb-next'); if (!next) return;   // DOM moved on before this deferred bind ran
  const o = state._onb;
  const FIELDS = ['username','weight','pushup','walk','age'];
  const upd = () => FIELDS.forEach(k => { const e = get('onb-'+k); if (e) o[k] = e.value; });
  const updConv = () => { const conv = get('onb-weight-conv'); if (!conv) return; const v = parseFloat(get('onb-weight').value); conv.textContent = (v>0) ? (o.unit==='imperial' ? `≈ ${fmt1(lbToKg(v))} kg` : `≈ ${fmt1(kgToLb(v))} lb`) : ''; };
  FIELDS.forEach(k => { const e = get('onb-'+k); if (e) e.addEventListener('input', upd); });
  const wEl = get('onb-weight'); if (wEl) wEl.addEventListener('input', updConv);
  const gh = get('onb-github'); if (gh) gh.addEventListener('click', ghSignIn);
  document.querySelectorAll('#onb-unit button').forEach(b => b.addEventListener('click', () => {
    const u = b.getAttribute('data-u'); if (u === o.unit) return;
    const cur = parseFloat(wEl.value);
    if (cur > 0) wEl.value = u === 'metric' ? fmt1(lbToKg(cur)) : fmt1(kgToLb(cur));
    o.unit = u;
    document.querySelectorAll('#onb-unit button').forEach(x => x.classList.toggle('on', x.getAttribute('data-u') === u));
    wEl.placeholder = u === 'imperial' ? '173' : '78.4';
    upd(); updConv();
  }));
  document.querySelectorAll('[data-phase]').forEach(el => el.addEventListener('click', () => {
    o.phase = Number(el.getAttribute('data-phase'));
    document.querySelectorAll('[data-phase]').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    const pv = get('plan-preview'); if (pv) pv.innerHTML = planPreviewHtml(o.phase);
  }));
  updConv();
  const back = get('onb-back'); if (back) back.addEventListener('click', () => { o.step = Math.max(1, (o.step||1) - 1); render(); });
  next.addEventListener('click', () => {
    upd();
    const r = o.step || 1;
    if (r === 1) {
      if (!slugify(o.username)) { toast('Pick a username to continue','error'); return; }
      const ag = parseInt(o.age,10); if (!(ag>=13 && ag<=100)) { toast('Enter a valid age (13–100)','error'); return; }
    }
    if (r === 2) {
      const w = o.unit==='imperial' ? lbToKg(parseFloat(o.weight)) : parseFloat(o.weight);
      if (!(w>=20 && w<=400)) { toast('Enter a valid body weight','error'); return; }
      const pu = o.pushup==='' ? 0 : parseInt(o.pushup,10), wk = o.walk==='' ? 0 : parseInt(o.walk,10);   // optional → 0
      if (!(pu>=0 && pu<=300)) { toast('Pushups should be a number (or leave blank)','error'); return; }
      if (!(wk>=0 && wk<=600)) { toast('Walk minutes should be a number (or leave blank)','error'); return; }
    }
    if (r < ONB_REAL) { o.step = r + 1; render(); return; }
    // finish
    const w = o.unit==='imperial' ? lbToKg(parseFloat(o.weight)) : parseFloat(o.weight);
    const pu = o.pushup==='' ? 0 : parseInt(o.pushup,10), wk = o.walk==='' ? 0 : parseInt(o.walk,10), ag = parseInt(o.age,10), slug = slugify(o.username);
    state.settings.units = o.unit; state.activeUser = slug;
    state.profile = { username: o.username.trim(), usernameSlug: slug, weightKg: Math.round(w*10)/10, maxPushup:pu, longestWalkMin:wk, age:ag, startingPhase:o.phase, createdAt:Date.now() };
    state.phase = { phase:o.phase, week:1, dayInWeek:1, sessionsCleared:0, lastDecision:null };
    state.pending = [];
    markDirty('profile','phase');
    logEvent('profile', `Created persona "${state.profile.username}" · starting ${PHASES[o.phase].name}`);
    delete state._onb;
    celebrate("You're set up. Let's do today's session.", () => navigate('today'));
  });
}

// Why-this-session rationale (grounded in docs/EVIDENCE-REVIEW.md)
function dayWhy() {
  const ph = state.phase?.phase ?? 0;
  const blocks = currentDayPlan().blocks;
  const hasStr = blocks.some(b => b.kind === 'strength');
  const hasRun = blocks.some(b => /run/i.test(b.title) || /run/i.test(b.label));
  const hasWalk = blocks.some(b => b.kind === 'cardio') && !hasRun;
  if (ph === 0) return { line: "Build the slowest tissue first — tendons and bone lag your heart and muscles.", points: [
    "Phase 0 is deliberately low-impact: daily walking, 10-min PT (balance, hips, calves), and protein — no loaded lifting or running yet.",
    "Connective tissue and bone adapt over months while muscle and cardio adapt in weeks, so we prep the structure before the stress (Bohm/Arampatzis, Sports Med 2015).",
    "Single-leg balance and hip work is the base that keeps knees and shins healthy once running starts." ] };
  if (ph >= 4) return { line: "Get faster and more durable with quality sets and quick movements — not 100 grinding reps.", points: [
    "Strength 2-3x/week at RIR 2-3 plus a little power (fast sit-to-stands, step-ups) and brief impact bone-snacks beats high-volume daily work for 40+.",
    "Near-daily training to failure raises injury risk without extra benefit at this age — quality and recovery win.",
    "Keep building toward 10K with the +10% session cap and a lighter week every 4-6 weeks." ] };
  if (hasRun) return { line: "Each run grows at most ~10% over your longest recent run — no hero sessions.", points: [
    "A single run that spikes far past what you have recently done is the strongest injury trigger, so we cap the jump, not the week (Johansen/Nielsen, BJSM 2025).",
    "Run-walk on non-consecutive days keeps impact tolerable while tendons and bone catch up.",
    "Novice and 40+ runners are the highest-risk group — easing in is the whole point." ] };
  if (hasStr) return { line: "Strength is your #1 injury insurance — and we stop 2-3 reps short of failure.", points: [
    "Resistance training cuts overuse injuries roughly in half (Lauersen, BJSM 2018) — the most evidence-backed thing in this program.",
    "Leave ~2-3 good reps in the tank (RIR 2-3); add load only after you hit your reps cleanly two sessions in a row.",
    "The heavy, slow calf and leg work is tendon-prep — it stiffens the tendons running will pound (Bohm/Arampatzis, 2015)." ] };
  if (hasWalk) return { line: "Easy, conversational cardio builds the aerobic base you can sustain without breaking down.", points: [
    "Easy, conversational pace (you can talk in full sentences) grows the engine with minimal injury risk.",
    "Aerobic fitness (VO2max) is among the strongest predictors of long-term health (Kokkinos, JACC 2022).",
    "This volume is the foundation your runs are built on." ] };
  return { line: "Recovery outranks everything — today's job is to let adaptation happen.", points: [
    "Rest and easy movement are when the work you did turns into fitness.",
    "Sleep, hydration, and protein (~1.6 g/kg/day spread across meals) drive recovery, especially at 40+." ] };
}

function bindCheck() {
  const goal = document.querySelector('[data-q="goal"]');
  if (!goal) return;   // DOM moved on before this deferred bind ran
  goal.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    state._chk.goalMet = btn.getAttribute('data-val');
    goal.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); refreshGo();
  }));
  const feel = document.querySelector('[data-q="feel"]');
  feel.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    state._chk.feel = Number(btn.getAttribute('data-val'));
    feel.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); refreshGo();
  }));
  document.getElementById('chk-hurt').addEventListener('click', () => {
    state._chk.hurt = !state._chk.hurt;
    if (!state._chk.hurt) { state._chk.parts = []; state._chk.redFlag = false; }
    render();
  });
  const flag = document.getElementById('chk-flag');
  if (flag) flag.addEventListener('click', () => { state._chk.redFlag = !state._chk.redFlag; render(); });
  document.querySelectorAll('[data-part]').forEach(el => el.addEventListener('click', () => {
    const p = el.getAttribute('data-part'); const i = state._chk.parts.indexOf(p);
    if (i >= 0) state._chk.parts.splice(i,1); else state._chk.parts.push(p);
    el.classList.toggle('sel');
  }));
  function refreshGo() { const g = document.getElementById('chk-go'); if (g) g.disabled = !(state._chk.goalMet && state._chk.feel); }
  document.getElementById('chk-go').addEventListener('click', () => {
    const t = state._chk;
    if (!(t.goalMet && t.feel)) return;
    const outcome = applyCheck(t.goalMet, t.feel, t.hurt, t.parts, t.redFlag);
    state.ui.resultOutcome = outcome;
    delete state._chk;
    navigate('result', { outcome: outcome.key });
  });
}

function renderResult(outcomeKey) {
  const o = (state.ui.resultOutcome && state.ui.resultOutcome.key === outcomeKey) ? state.ui.resultOutcome : (OUTCOMES[outcomeKey] || OUTCOMES.repeat);
  let modifyHtml = '';

function drawReadiness() {
  const canvas = document.getElementById('chart-readiness');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const cssColor = n => getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
  const values = state.checks.slice(-20).map(c => c.feel);
  const w = canvas.clientWidth, h = 120;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const bottom = document.getElementById('chart-readiness-bottom');
  if (values.length < 2) {
    ctx.fillStyle = cssColor('paper-low'); ctx.font = "13px 'IBM Plex Sans', sans-serif"; ctx.textAlign='center';
    ctx.fillText(values.length===0 ? 'Check in to see readiness' : 'Need two check-ins', w/2, h/2);
    if (bottom) bottom.innerHTML = ''; return;
  }
  const pad = 8, mn = 1, mx = 5, span = mx - mn;
  ctx.strokeStyle = cssColor('rule'); ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  [2].forEach(y => { const ny = pad + (h-pad*2) - ((y-mn)/span)*(h-pad*2); ctx.beginPath(); ctx.moveTo(pad,ny); ctx.lineTo(w-pad,ny); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.strokeStyle = cssColor('cardio'); ctx.lineWidth = 2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath();
  values.forEach((v,i)=>{ const x=pad+(i/(values.length-1))*(w-pad*2); const y=pad+(h-pad*2)-((v-mn)/span)*(h-pad*2); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
  ctx.fillStyle = cssColor('cardio');
  values.forEach((v,i)=>{ const x=pad+(i/(values.length-1))*(w-pad*2); const y=pad+(h-pad*2)-((v-mn)/span)*(h-pad*2); ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); });
  if (bottom) { const last = values[values.length-1]; bottom.innerHTML = `<span>Latest ${FEEL_LABELS[last]}</span><span>${values.length} check-ins</span>`; }
}
window.addEventListener('resize', () => { if (state.ui.screen === 'progress') drawReadiness(); });

function bindSettings() {
  const signin = document.getElementById('s-signin');
  if (signin) signin.addEventListener('click', ghSignIn);
  const repo=document.getElementById('s-repo'), pat=document.getElementById('s-pat'), autosync=document.getElementById('s-autosync');
  if (!repo || !pat) return;   // DOM moved on before this deferred bind ran
  repo.addEventListener('input', () => { state.settings.repo=repo.value.trim(); saveLocal(); });
  pat.addEventListener('input',  () => { state.settings.pat=pat.value.trim(); saveLocal(); });
  autosync.addEventListener('change', () => { state.settings.autoSync=autosync.checked; saveLocal(); });
  const loaduser = document.getElementById('s-loaduser');
  if (loaduser) loaduser.addEventListener('click', async () => {
    const slug = slugify(document.getElementById('s-user').value);
    if (!slug) { toast('Enter a username','error'); return; }
    if (!isConfigured()) { toast('Enter repo + token first','error'); return; }
    if (!confirm(`Switch this device to persona "${slug}" and load its data from GitHub?`)) return;
    state.activeUser = slug;
    localStorage.setItem(ACTIVE_KEY, slug);
    loadUserState(slug);            // use any local copy first
    await syncFromRemote();         // then pull the latest for this persona
    saveLocal();
    if (state.profile) logEvent('persona', `Loaded persona "${slug}" from GitHub`);
    navigate(state.profile ? 'today' : 'onboarding');
    toast(state.profile ? `Loaded persona ${slug}` : `No data yet for ${slug} — set it up`, state.profile ? 'success' : 'error');
  });
  document.getElementById('s-test').addEventListener('click', async () => {
    if (!isConfigured()) { toast('Enter repo + token first','error'); return; }
    if (!activeSlug()) { toast('Set a username first (finish onboarding)','error'); return; }
    state.pending = [...DATA_KEYS]; await syncToRemote();
    if (state.ui.syncStatus==='online') logEvent('sync', 'Pushed all data to GitHub');
    toast(state.ui.syncStatus==='online'?'Pushed to GitHub':'Sync failed — check repo and token', state.ui.syncStatus==='online'?'success':'error');
  });
  document.getElementById('s-pull').addEventListener('click', async () => {
    if (!isConfigured()) { toast('Enter repo + token first','error'); return; }
    if (!confirm('Replace local data with what is in GitHub?')) return;
    await syncFromRemote(); logEvent('sync', 'Pulled all data from GitHub'); render(); toast('Pulled from GitHub','success');
  });
  document.getElementById('s-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), appVersion:APP_VERSION, profile:state.profile, phase:state.phase, checks:state.checks }, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=`foundation-export-${isoToday()}.json`; a.click(); URL.revokeObjectURL(url);
    toast('Downloaded','success');
  });
  document.getElementById('s-reset').addEventListener('click', () => {
    if (!confirm('Delete this persona\'s profile, checks, and progress on this device? GitHub data is untouched.')) return;
    const slug = activeSlug();
    if (slug) localStorage.removeItem(userStateKey(slug));
    state.profile=null; state.phase=null; state.checks=[]; state.pending=[];
    navigate('onboarding'); toast('Local data cleared','success');
  });
}

// ============================================================
// INIT
// ============================================================
async function init() {
  loadLocal();
  navigate(state.profile ? 'today' : 'onboarding');
  if (isConfigured()) {
    if (state.profile == null && state.activeUser) { await syncFromRemote(); if (state.profile) navigate('today'); else if (state.ui.syncStatus !== 'error') setSync('offline', 'Local only'); }
    else if (state.profile == null) { setSync('offline', 'Local only'); }
    else if (state.pending.length) await syncToRemote();
    else setSync('online', 'Synced');
  } else setSync('offline', 'Local only');
}
window.addEventListener('online',  () => { setSync('syncing','Reconnecting'); syncToRemote(); });
window.addEventListener('offline', () => { setSync('offline','Offline'); });
// Offline support: cache the app shell so it opens without a network connection.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
init();

</script>
