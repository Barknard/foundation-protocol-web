<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1614">
<meta name="color-scheme" content="dark">
<title>The Hard Part</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="./manifest.json">
<!-- Fonts are self-hosted (woff2 in fonts/, @font-face in css/base.css) so the app renders fully offline. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/figures.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div id="app">
  <!-- screens render here -->
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- "there's more below" hint: shows on scrollable screens, bobs, hides at the bottom (see ui.js updateScrollCue). -->
<div id="scroll-cue" aria-hidden="true">
  <span class="sc-word">scroll</span>
  <svg class="sc-chev" viewBox="0 0 24 15" width="22" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3l9 9 9-9"/><path d="M6 3l6 6 6-6"/><path d="M9 3l3 3 3-3"/>
  </svg>
</div>

<!-- App modules — loaded in dependency order (classic scripts share one global scope). -->
<script src="js/sprite.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/program.js"></script>
<script src="js/figure-poses.js"></script>
<script src="js/figure.js"></script>
<script src="js/foot.js"></script>
<script src="js/engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/init.js"></script>

</body>
</html>
